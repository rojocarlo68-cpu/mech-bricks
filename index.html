<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Mech Bricks</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #1a1a1e;
      font-family: system-ui, -apple-system, sans-serif;
      color: #f2f2f2;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    #wrap {
      position: relative;
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
    }
    #hud {
      flex: 0 0 auto;
      display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
      padding: 10px 12px;
      padding-top: max(10px, env(safe-area-inset-top));
      background: rgba(0,0,0,.55);
      backdrop-filter: blur(8px);
      z-index: 2;
    }
    #hud h1 {
      font-size: 15px; font-weight: 650; margin-right: auto;
      letter-spacing: .02em;
    }
    #hud .meta { font-size: 12px; opacity: .7; margin-right: 8px; }
    button, select {
      appearance: none;
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 600;
      background: #e85d04;
      color: #fff;
      min-height: 40px;
    }
    button.secondary { background: #3a3a42; }
    button:active { transform: scale(.97); opacity: .9; }
    select {
      background: #3a3a42;
      color: #fff;
      padding-right: 28px;
      background-image: linear-gradient(45deg, transparent 50%, #aaa 50%), linear-gradient(135deg, #aaa 50%, transparent 50%);
      background-position: calc(100% - 14px) 55%, calc(100% - 9px) 55%;
      background-size: 5px 5px, 5px 5px;
      background-repeat: no-repeat;
    }
    #stage {
      flex: 1 1 auto;
      position: relative;
      overflow: hidden;
      background: radial-gradient(ellipse at 50% 30%, #2a2a32 0%, #121216 70%);
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    #hint {
      position: absolute;
      left: 50%; top: 42%;
      transform: translate(-50%, -50%);
      text-align: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity .35s ease;
      z-index: 1;
      text-shadow: 0 2px 12px rgba(0,0,0,.8);
      padding: 0 16px;
    }
    #hint.show { opacity: 1; }
    #hint strong { display: block; font-size: 18px; margin-bottom: 4px; }
    #hint span { font-size: 13px; opacity: .75; }
    #loading {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: #121216;
      z-index: 3;
      font-size: 15px;
    }
    #loading.hide { display: none; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="hud">
      <h1>Mech Bricks</h1>
      <span class="meta" id="count">—</span>
      <select id="size" aria-label="Tamaño de ladrillo">
        <option value="4">Ladrillo grande</option>
        <option value="3" selected>Ladrillo medio</option>
        <option value="2">Ladrillo chico</option>
      </select>
      <button type="button" id="shatter">Romper</button>
      <button type="button" class="secondary" id="reset">Reiniciar</button>
    </div>
    <div id="stage">
      <div id="loading">Armando el mech…</div>
      <div id="hint"><strong>Toca para romper</strong><span>Los ladrillos caen con gravedad</span></div>
      <canvas id="c"></canvas>
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
