<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Mech Arkanoid</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #0e0e12;
      font-family: system-ui, -apple-system, sans-serif;
      color: #f2f2f2;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    #wrap { width: 100%; height: 100%; display: flex; flex-direction: column; }
    #hud {
      flex: 0 0 auto;
      display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
      padding: 10px 12px;
      padding-top: max(10px, env(safe-area-inset-top));
      background: rgba(0,0,0,.55);
      backdrop-filter: blur(8px);
      z-index: 2;
    }
    #hud h1 { font-size: 15px; font-weight: 650; margin-right: auto; }
    #hud .meta { font-size: 12px; opacity: .8; }
    button {
      appearance: none; border: 0; border-radius: 10px;
      padding: 10px 14px; font-size: 14px; font-weight: 600;
      background: #e85d04; color: #fff; min-height: 40px;
    }
    button.secondary { background: #3a3a42; }
    button:active { transform: scale(.97); opacity: .9; }
    .img-btn {
      background: transparent !important;
      padding: 0 !important;
      min-height: 0 !important;
      border-radius: 8px;
      line-height: 0;
    }
    .img-btn img {
      display: block;
      height: 44px;
      width: auto;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,.55));
    }
    .img-btn:active { transform: scale(.96); opacity: .95; }
    #pauseOverlay .img-btn img, #shopOverlay .img-btn img, #packOverlay .img-btn img { height: 72px; margin: 0 auto; }
    .menu-btns .img-btn { width: auto; align-self: center; background: transparent !important; }

    #stage {
      flex: 1 1 auto;
      position: relative;
      overflow: hidden;
      background: #1a0f08;
    }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #topRight {
      position: absolute;
      top: max(10px, env(safe-area-inset-top));
      right: 12px;
      z-index: 4;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      pointer-events: none;
      filter: drop-shadow(0 1px 3px rgba(0,0,0,.75));
    }
    #score {
      display: flex; align-items: center; gap: 6px;
      font-size: 16px; font-weight: 700; color: #b8f5c2;
      text-shadow: 0 1px 4px rgba(0,0,0,.8);
    }
    #score .bills { font-size: 18px; line-height: 1; }
    #lives { display: flex; gap: 6px; }
    .heart-wrap { width: 22px; height: 20px; position: relative; display: inline-block; }
    .heart-wrap::before {
      content: "♥"; position: absolute; inset: 0;
      font-size: 22px; line-height: 20px; color: rgba(74, 10, 92, 0.22);
    }
    .heart-fill {
      position: absolute; left: 0; top: 0; bottom: 0; overflow: hidden;
      font-size: 22px; line-height: 20px; color: #4a0a5c;
    }
    #btnBomb {
      position: absolute;
      top: max(8px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      z-index: 6;
      display: none;
      pointer-events: auto;
      background: transparent !important;
      padding: 0 !important;
      min-height: 0 !important;
      border-radius: 10px;
      line-height: 0;
      filter: drop-shadow(0 3px 8px rgba(0,0,0,.65));
    }
    #btnBomb.show { display: block; }
    #btnBomb img {
      display: block;
      height: 76px; /* ~1.7× pause (44px) */
      width: auto;
    }
    #btnBomb:active { transform: translateX(-50%) scale(.96); opacity: .95; }

    #hint {
      position: absolute; left: 50%; top: 55%;
      transform: translate(-50%, -50%);
      text-align: center; pointer-events: none;
      opacity: 0; transition: opacity .3s ease; z-index: 1;
      text-shadow: 0 2px 14px rgba(0,0,0,.85);
      padding: 0 16px;
    }
    #hint.show { opacity: 1; }
    #hint strong { display: block; font-size: 18px; margin-bottom: 4px; }
    #hint span { font-size: 13px; opacity: .75; }
    #loading {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: #1a0f08; z-index: 3; font-size: 15px;
    }
    #loading.hide { display: none; }

    /* Pause / menus */
    .overlay {
      position: absolute; inset: 0; z-index: 20;
      background: rgba(6, 8, 14, 0.72);
      backdrop-filter: blur(6px);
      display: none; align-items: center; justify-content: center;
      padding: 16px;
      pointer-events: auto;
    }
    .overlay.show { display: flex; }
    .panel {
      width: min(420px, 100%);
      max-height: min(78vh, 640px);
      overflow: auto;
      background: #1a1f2b;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 16px;
      padding: 18px 16px 16px;
      box-shadow: 0 20px 50px rgba(0,0,0,.45);
    }
    .panel h2 { font-size: 20px; margin-bottom: 6px; }
    .panel .sub { font-size: 13px; opacity: .7; margin-bottom: 14px; }
    .menu-btns { display: flex; flex-direction: column; gap: 8px; }
    .menu-btns button { width: 100%; }
    .shop-item, .pack-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px; border-radius: 12px;
      background: rgba(255,255,255,.05);
      margin-bottom: 8px;
    }
    .shop-item .icon, .pack-item .icon { font-size: 22px; width: 28px; text-align: center; }
    .shop-item .info, .pack-item .info { flex: 1; min-width: 0; }
    .shop-item .name, .pack-item .name { font-weight: 650; font-size: 14px; }
    .shop-item .desc, .pack-item .desc { font-size: 12px; opacity: .7; }
    .shop-item .price { font-weight: 700; color: #b8f5c2; font-size: 13px; margin-right: 6px; }
    .shop-item button, .pack-item button { padding: 8px 12px; min-height: 36px; font-size: 13px; }
    .back-row { margin-top: 10px; }
    #packSlots { font-size: 12px; opacity: .75; margin-bottom: 10px; }
    .shop-money, .pack-money {
      display: inline-block;
      margin: 0 0 10px;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.02em;
      color: #ffe08a;
      background: linear-gradient(180deg, rgba(80, 55, 10, 0.85), rgba(40, 28, 6, 0.9));
      border: 1px solid rgba(255, 210, 100, 0.55);
      box-shadow: 0 0 12px rgba(255, 190, 60, 0.25), inset 0 1px 0 rgba(255,255,255,0.12);
      text-shadow: 0 1px 2px rgba(0,0,0,.75);
    }

    #laserCd {
      display: none;
      flex: 0 0 auto;
      width: 100%;
      padding: 4px 12px 6px;
      background: rgba(0,0,0,.4);
      pointer-events: none;
      text-align: center;
      z-index: 2;
    }
    #laserCd .laser-cd-inner {
      width: min(260px, 70vw);
      margin: 0 auto;
    }
    #laserCd.show { display: block; }
    #laserCd .laser-cd-label {
      font-size: 11px;
      font-weight: 650;
      letter-spacing: 0.04em;
      color: #9ad8ff;
      margin-bottom: 4px;
      text-shadow: 0 1px 3px rgba(0,0,0,.85);
    }
    #laserCd .laser-cd-track {
      height: 7px;
      border-radius: 999px;
      background: rgba(20, 28, 40, 0.72);
      border: 1px solid rgba(120, 200, 255, 0.35);
      overflow: hidden;
    }
    #laserCdFill {
      height: 100%;
      width: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #1e90ff, #5cf0ff 55%, #e8ffff);
      box-shadow: 0 0 10px rgba(80, 220, 255, 0.65);
      transition: width 0.08s linear;
    }
    #laserCd.firing .laser-cd-label { color: #dffcff; }
    #laserCd.firing #laserCdFill {
      animation: laserPulse 0.45s ease-in-out infinite alternate;
    }
    @keyframes laserPulse {
      from { filter: brightness(1); opacity: 0.85; }
      to { filter: brightness(1.35); opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="hud">
      <h1>Mech Arkanoid</h1>
      <span class="meta" id="count">—</span>
      <button type="button" class="img-btn" id="btnPause" aria-label="Pausa">
        <img id="btnPauseImg" src="btn-pause.png" alt="Pausa" />
      </button>
      <button type="button" class="secondary" id="reset">Reiniciar</button>
    </div>
    <div id="laserCd" aria-hidden="true">
      <div class="laser-cd-inner">
        <div class="laser-cd-label">Cañones · enfriamiento</div>
        <div class="laser-cd-track"><div id="laserCdFill"></div></div>
      </div>
    </div>
    <div id="stage">
      <div id="topRight">
        <div id="score"><span class="bills" aria-hidden="true">💵</span><span id="scoreVal">$0</span></div>
        <div id="lives" aria-label="Vidas"></div>
      </div>
      <button type="button" class="img-btn" id="btnBomb" aria-label="Bomba" aria-hidden="true">
        <img id="btnBombImg" src="btn-bomb.png" alt="Bomba" />
      </button>
      <div id="loading">Armando el campo…</div>
      <div id="hint"><strong>Desliza la paleta</strong><span>Toca para lanzar la bola</span></div>
      <canvas id="c"></canvas>

      <div id="pauseOverlay" class="overlay" aria-hidden="true">
        <div class="panel">
          <h2>Pausa</h2>
          <p class="sub">Partida en espera</p>
          <div class="menu-btns">
            <button type="button" id="btnResume">Continuar</button>
            <button type="button" class="img-btn" id="btnShop" aria-label="Tienda">
              <img id="btnShopImg" src="btn-shop.png" alt="Tienda" />
            </button>
            <button type="button" class="img-btn" id="btnPack" aria-label="Mochila">
              <img id="btnPackImg" src="btn-pack.png" alt="Mochila" />
            </button>
          </div>
        </div>
      </div>

      <div id="shopOverlay" class="overlay" aria-hidden="true">
        <div class="panel">
          <h2>Tienda</h2>
          <p class="shop-money" id="shopMoney">$0</p>
          <p class="sub">Se guarda en la mochila (máx. 5)</p>
          <div id="shopList"></div>
          <div class="back-row"><button type="button" class="secondary" id="btnShopBack">Volver</button></div>
        </div>
      </div>

      <div id="packOverlay" class="overlay" aria-hidden="true">
        <div class="panel">
          <h2>Mochila</h2>
          <p class="pack-money" id="packMoney">$0</p>
          <p id="packSlots" class="sub">0 / 5 espacios</p>
          <div id="packList"></div>
          <div class="back-row"><button type="button" class="secondary" id="btnPackBack">Volver</button></div>
        </div>
      </div>
    </div>
  </div>
  <script src="game.js?v=18"></script>
</body>
</html>
