<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Mech Arkanoid</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #0e0e12;
      font-family: system-ui, -apple-system, sans-serif;
      color: #f2f2f2;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    #wrap { width: 100%; height: 100%; display: flex; flex-direction: column; }
    #hud {
      flex: 0 0 auto;
      display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
      padding: 10px 12px;
      padding-top: max(10px, env(safe-area-inset-top));
      background: rgba(0,0,0,.55);
      backdrop-filter: blur(8px);
      z-index: 2;
    }
    #hud h1 { font-size: 15px; font-weight: 650; margin-right: auto; }
    #hud .meta { font-size: 12px; opacity: .8; }
    button {
      appearance: none; border: 0; border-radius: 10px;
      padding: 10px 14px; font-size: 14px; font-weight: 600;
      background: #e85d04; color: #fff; min-height: 40px;
    }
    button.secondary { background: #3a3a42; }
    button:active { transform: scale(.97); opacity: .9; }
    #stage {
      flex: 1 1 auto;
      position: relative;
      overflow: hidden;
      background: #1a0f08;
    }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #topRight {
      position: absolute;
      top: max(10px, env(safe-area-inset-top));
      right: 12px;
      z-index: 4;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      pointer-events: none;
      filter: drop-shadow(0 1px 3px rgba(0,0,0,.75));
    }
    #score {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 16px;
      font-weight: 700;
      color: #b8f5c2;
      letter-spacing: 0.02em;
      text-shadow: 0 1px 4px rgba(0,0,0,.8);
    }
    #score .bills { font-size: 18px; line-height: 1; }
    #lives {
      display: flex;
      gap: 6px;
    }
    .heart-wrap {
      width: 22px; height: 20px;
      position: relative;
      display: inline-block;
    }
    .heart-wrap::before {
      content: "♥";
      position: absolute; inset: 0;
      font-size: 22px; line-height: 20px;
      color: rgba(74, 10, 92, 0.22);
    }
    .heart-fill {
      position: absolute; left: 0; top: 0; bottom: 0;
      overflow: hidden;
      font-size: 22px; line-height: 20px;
      color: #4a0a5c;
    }
    #hint {
      position: absolute; left: 50%; top: 55%;
      transform: translate(-50%, -50%);
      text-align: center; pointer-events: none;
      opacity: 0; transition: opacity .3s ease; z-index: 1;
      text-shadow: 0 2px 14px rgba(0,0,0,.85);
      padding: 0 16px;
    }
    #hint.show { opacity: 1; }
    #hint strong { display: block; font-size: 18px; margin-bottom: 4px; }
    #hint span { font-size: 13px; opacity: .75; }
    #loading {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: #1a0f08; z-index: 3; font-size: 15px;
    }
    #loading.hide { display: none; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="hud">
      <h1>Mech Arkanoid</h1>
      <span class="meta" id="count">—</span>
      <button type="button" class="secondary" id="reset">Reiniciar</button>
    </div>
    <div id="stage">
      <div id="topRight">
        <div id="score"><span class="bills" aria-hidden="true">💵</span><span id="scoreVal">$0</span></div>
        <div id="lives" aria-label="Vidas"></div>
      </div>
      <div id="loading">Armando el campo…</div>
      <div id="hint"><strong>Desliza la paleta</strong><span>Toca para lanzar la bola</span></div>
      <canvas id="c"></canvas>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
